name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f export_presets.cfg
          mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/StormOverEuropeMobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormOverEuropeMobile-APK
          path: build/StormOverEuropeMobile.apk
          if-no-files-found: error
          retention-days: 14
